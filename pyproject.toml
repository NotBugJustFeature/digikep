[project]
name = "digikep"
version = "0.1.0"
description = "Train and run a YOLO playing-card detector on images, videos, and live camera input."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.49,<7",
    "kagglehub>=0.4.3,<2",
    "opencv-python>=4.10,<5",
    "pyyaml>=6.0,<7",
    "ultralytics>=8.3,<9",
]

[project.scripts]
cardsight = "cardsight.app:main"
cardsight-train = "cardsight.training:main"
cardsight-download = "cardsight.dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardsight"]
